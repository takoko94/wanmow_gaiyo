<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>わんも～推し犬総選挙 概要</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  width:1280px;
  height:720px;

  overflow:hidden;

  position:relative;

  font-family:'Panda',sans-serif;

  background:#f6dfb7;
}

/* 背景 */

.bg{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:0.23;

  z-index:-3;
}

.overlay{

  position:absolute;

  inset:0;

  background:
    rgba(255,250,245,0.30);

  z-index:-2;
}

/* 外枠 */

.frame{

  position:absolute;

  inset:14px;

  border-radius:28px;

  background:
    rgba(255,255,255,0.58);

  border:
    3px dashed #efb9b9;
}

/* 背景装飾 */

.star{

  position:absolute;

  font-size:54px;

  opacity:0.45;
}

.star1{
  left:95px;
  top:105px;
  color:#f6a9b6;
}

.star2{
  right:120px;
  top:120px;
  color:#f0c18a;
}

.star3{
  left:110px;
  bottom:150px;
  color:#b5d6b7;
}

.star4{
  right:110px;
  bottom:130px;
  color:#f3d58d;
}

/* メイン */

.container{

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  padding-top:18px;
}

/* ロゴ */

.logo{

  width:350px;

  margin-bottom:8px;

  filter:
    drop-shadow(0 6px 16px rgba(255,255,255,0.9));
}

/* スライド */

.slide{

  width:980px;

  height:430px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.95),
      rgba(255,255,255,0.90)
    );

  border-radius:48px;

  border:
    7px solid #f5c1cb;

  padding:
    42px
    58px;

  display:none;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  text-align:center;

  position:relative;

  box-shadow:
    0 14px 28px rgba(0,0,0,0.08);
}

.slide.active{
  display:flex;
}

/* 見出し */

.heading{

  font-size:76px;

  color:#ff8fb0;

  line-height:1.15;

  text-shadow:
    0 5px 0 #fff;

  margin-bottom:28px;
}

/* 本文 */

.text{

  font-size:54px;

  line-height:1.55;

  color:#7c6558;
}

/* 強調 */

.pink{
  color:#ff8fb0;
}

.green{
  color:#67b08b;
}

.orange{
  color:#ffb053;
}

/* 区切り */

.line{

  width:82%;

  height:4px;

  border-radius:999px;

  background:
    repeating-linear-gradient(
      90deg,
      #f6b8c7 0px,
      #f6b8c7 12px,
      transparent 12px,
      transparent 24px
    );

  margin:
    22px
    0;
}

/* コイン */

.coin{

  position:absolute;

  right:80px;
  bottom:42px;

  width:130px;

  filter:
    drop-shadow(0 6px 10px rgba(0,0,0,0.12));
}

/* ボタン */

.btnArea{

  width:1180px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-top:20px;
}

.navBtn{

  width:190px;
  height:68px;

  border:none;

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #f8b8c7,
      #f4c98b
    );

  color:white;

  font-size:34px;

  font-family:'Panda',sans-serif;

  cursor:pointer;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.10);

  transition:0.2s;
}

.navBtn:hover{

  transform:translateY(-2px);
}

/* ページ */

.page{

  width:190px;
  height:68px;

  border-radius:999px;

  background:
    rgba(255,255,255,0.92);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:38px;

  color:#8a7164;

  box-shadow:
    0 8px 18px rgba(0,0,0,0.08);
}

</style>
</head>

<body>

<!-- 背景 -->

<img src="haikei.png" class="bg">

<div class="overlay"></div>

<div class="frame"></div>

<!-- 装飾 -->

<div class="star star1">✦</div>
<div class="star star2">✦</div>
<div class="star star3">✦</div>
<div class="star star4">✦</div>

<!-- メイン -->

<div class="container">

  <!-- ロゴ -->

  <img src="wan_logo.png" class="logo">

  <!-- スライド1 -->

  <div class="slide active">

    <div class="heading">
      投票方法
    </div>

    <div class="text">

      商品を<br>

      <span class="pink">
        10個購入ごとに1票
      </span>

      投票可能！<br><br>

      投票する犬種は<br>

      <span class="pink">
        なんでもOK!!
      </span><br>

      ミックス犬でもOK！

    </div>

  </div>

  <!-- スライド2 -->

  <div class="slide">

    <div class="heading">
      1位〜3位の犬種は…
    </div>

    <div class="text">

      <span class="orange">1位</span>
      フード・ぬいぐるみ・ラテアート<br><br>

      <span class="orange">2位</span>
      ぬいぐるみ・ラテアート<br><br>

      <span class="orange">3位</span>
      ラテアート

    </div>

  </div>

  <!-- スライド3 -->

  <div class="slide">

    <div class="heading">
      1位に輝いた犬に<br>
      いちばん投票したお客様には…
    </div>

    <div class="text">

      <span class="pink">
        特別なプレゼント
      </span><br>

      を贈呈します！

    </div>

  </div>

  <!-- スライド4 -->

  <div class="slide">

    <div class="heading">
      さらに！
    </div>

    <div class="text">

      投票1票ごとに<br>

      <span class="green">
        わんも〜コイン1枚
      </span>

      プレゼント！

    </div>

    <div class="line"></div>

    <div class="text">

      キャンペーン終了後に<br>

      <span class="pink">
        10枚
      </span>

      でクッキーと交換可能！

    </div>

    <!-- コイン -->

    <img src="coin.png" class="coin">

  </div>

  <!-- ボタン -->

  <div class="btnArea">

    <button class="navBtn" id="prevBtn">
      ◀ 戻る
    </button>

    <div class="page" id="page">
      1 / 4
    </div>

    <button class="navBtn" id="nextBtn">
      次へ ▶
    </button>

  </div>

</div>

<script>

const slides =
document.querySelectorAll('.slide');

const nextBtn =
document.getElementById('nextBtn');

const prevBtn =
document.getElementById('prevBtn');

const page =
document.getElementById('page');

let current = 0;

function updateSlide(){

  slides.forEach(slide=>{
    slide.classList.remove('active');
  });

  slides[current]
  .classList.add('active');

  page.innerHTML =
    `${current+1} / ${slides.length}`;
}

/* 次へ */

nextBtn.onclick = ()=>{

  current++;

  if(current >= slides.length){

    current = 0;
  }

  updateSlide();
};

/* 戻る */

prevBtn.onclick = ()=>{

  current--;

  if(current < 0){

    current =
      slides.length - 1;
  }

  updateSlide();
};

</script>

</body>
</html>
