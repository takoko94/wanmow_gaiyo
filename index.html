<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>わんも～推し犬総選挙 概要</title>

<style>

@font-face{
  font-family:'Panda';
  src:url('pandabakery.ttf');
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  width:1280px;
  height:720px;

  overflow:hidden;

  position:relative;

  font-family:'Panda',sans-serif;
}

/* 背景 */

.bg{

  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:-3;
}

.overlay{

  position:absolute;

  inset:0;

  background:
    rgba(255,248,252,0.32);

  z-index:-2;
}

/* 背景装飾 */

.circle{

  position:absolute;

  border-radius:999px;

  background:
    rgba(255,255,255,0.35);
}

.circle1{
  width:320px;
  height:320px;
  left:-120px;
  top:-120px;
}

.circle2{
  width:220px;
  height:220px;
  right:-60px;
  top:140px;
}

.circle3{
  width:260px;
  height:260px;
  bottom:-120px;
  right:240px;
}

/* 全体 */

.container{

  width:100%;
  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  position:relative;
}

/* ロゴ */

.logo{

  width:280px;

  margin-bottom:10px;

  filter:
    drop-shadow(0 6px 18px rgba(255,255,255,0.9));
}

/* タイトル */

.mainTitle{

  font-size:68px;

  color:#ff8fb0;

  letter-spacing:4px;

  text-shadow:
    0 5px 0 #fff,
    0 10px 25px rgba(255,143,176,0.32);

  margin-bottom:14px;
}

/* スライド */

.slide{

  width:980px;

  min-height:270px;

  background:
    rgba(255,255,255,0.9);

  border-radius:42px;

  padding:
    40px
    50px;

  box-shadow:
    0 14px 28px rgba(0,0,0,0.08);

  display:none;

  flex-direction:column;

  justify-content:center;

  text-align:center;
}

.slide.active{
  display:flex;
}

/* 見出し */

.heading{

  font-size:54px;

  color:#ff8fb0;

  line-height:1.25;

  text-shadow:
    0 4px 0 #fff;

  margin-bottom:26px;
}

/* 本文 */

.text{

  font-size:40px;

  line-height:1.6;

  color:#6f6259;
}

/* 強調 */

.pink{
  color:#ff8fb0;
}

.orange{
  color:#ff9b42;
}

.green{
  color:#63a785;
}

/* ボタン */

.nextBtn{

  margin-top:34px;

  width:260px;
  height:74px;

  border:none;

  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      #ffbfd7,
      #ffd98c
    );

  color:white;

  font-size:34px;

  font-family:'Panda',sans-serif;

  cursor:pointer;

  box-shadow:
    0 10px 20px rgba(0,0,0,0.12);
}

/* ページ */

.page{

  margin-top:16px;

  font-size:24px;

  color:#9a7b68;
}

</style>
</head>

<body>

<!-- 背景 -->

<img src="haikei.png" class="bg">

<div class="overlay"></div>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<!-- メイン -->

<div class="container">

  <!-- ロゴ -->

  <img src="wan_logo.png" class="logo">

  <!-- タイトル -->

  <div class="mainTitle">
    わんも～推し犬総選挙
  </div>

  <!-- スライド1 -->

  <div class="slide active">

    <div class="heading">
      投票方法
    </div>

    <div class="text">
      商品を<span class="pink">10個購入ごとに1票</span>投票可能！<br>
      投票する犬種は<span class="pink">なんでもOK!!</span><br>
      ミックス犬でもOK！
    </div>

  </div>

  <!-- スライド2 -->

  <div class="slide">

    <div class="heading">
      投票数が<br>
      1位～3位の犬種は…
    </div>

    <div class="text">
      <span class="orange">1位</span>：フード・ぬいぐるみ・ラテアート<br><br>

      <span class="orange">2位</span>：ぬいぐるみ・ラテアート<br><br>

      <span class="orange">3位</span>：ラテアート
    </div>

  </div>

  <!-- スライド3 -->

  <div class="slide">

    <div class="heading">
      1位に輝いた犬に<br>
      いちばん投票したお客様には…
    </div>

    <div class="text">
      <span class="pink">
        特別なプレゼント
      </span><br>
      を贈呈します！
    </div>

  </div>

  <!-- スライド4 -->

  <div class="slide">

    <div class="heading">
      さらに！
    </div>

    <div class="text">
      投票1票ごとに<br>
      <span class="green">
        わんも～コイン1枚
      </span>
      プレゼント！<br><br>

      キャンペーン終了後に<br>
      10枚でクッキーと交換可能！
    </div>

  </div>

  <!-- ボタン -->

  <button class="nextBtn" id="nextBtn">
    次へ ▶
  </button>

  <!-- ページ -->

  <div class="page" id="page">
    1 / 4
  </div>

</div>

<script>

const slides =
document.querySelectorAll('.slide');

const nextBtn =
document.getElementById('nextBtn');

const page =
document.getElementById('page');

let current = 0;

nextBtn.onclick = ()=>{

  slides[current]
  .classList.remove('active');

  current++;

  if(current >= slides.length){

    current = 0;
  }

  slides[current]
  .classList.add('active');

  page.innerHTML =
    `${current+1} / ${slides.length}`;
};

</script>

</body>
</html>
